<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary Meta Tags -->
  <title>CryptoView — Multi-Crypto Real-Time Chart Terminal | Imran Pollob</title>
  <meta name="title" content="CryptoView — Multi-Crypto Real-Time Chart Terminal | Imran Pollob" />
  <meta name="description"
    content="Simultaneously view and analyze multiple real-time cryptocurrency charts powered by Coinbase API and TradingView. Customize grid layouts, search 100+ crypto pairs, and monitor Bitcoin, Ethereum, and Solana live." />
  <meta name="keywords"
    content="crypto chart viewer, multi crypto charts, tradingview crypto, real time crypto dashboard, bitcoin chart, ethereum chart, solana chart, live cryptocurrency prices, coinbase api, technical analysis terminal, imran pollob" />
  <meta name="author" content="Imran Pollob" />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
  <meta name="theme-color" content="#071311" />
  <link rel="canonical" href="https://imranpollob.github.io/crypto-chart-viewer/" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="CryptoView" />
  <meta property="og:url" content="https://imranpollob.github.io/crypto-chart-viewer/" />
  <meta property="og:title" content="CryptoView — Multi-Crypto Real-Time Chart Terminal" />
  <meta property="og:description"
    content="Simultaneously view and analyze multiple real-time cryptocurrency charts powered by Coinbase API and TradingView. Customize grid layouts and monitor live market trends." />
  <meta property="og:image" content="https://imranpollob.github.io/crypto-chart-viewer/screenshot.png" />
  <meta property="og:image:alt" content="CryptoView Real-Time Cryptocurrency Chart Dashboard" />

  <!-- Twitter / X -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://imranpollob.github.io/crypto-chart-viewer/" />
  <meta property="twitter:title" content="CryptoView — Multi-Crypto Real-Time Chart Terminal" />
  <meta property="twitter:description"
    content="Simultaneously view and analyze multiple real-time cryptocurrency charts powered by Coinbase API and TradingView. Track BTC, ETH, and top tokens live." />
  <meta property="twitter:image" content="https://imranpollob.github.io/crypto-chart-viewer/screenshot.png" />

  <!-- Favicons & App Icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="shortcut icon" href="favicon.ico" />

  <!-- Google Fonts: Plus Jakarta Sans (body) & Outfit (headings/brand) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <!-- Application Stylesheet -->
  <link rel="stylesheet" href="style.css" />

  <!-- JSON-LD Structured Data Schema -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "CryptoView",
    "url": "https://imranpollob.github.io/crypto-chart-viewer/",
    "description": "Real-time cryptocurrency multi-chart viewer and trading terminal powered by Coinbase API and TradingView interactive charts.",
    "applicationCategory": "FinanceApplication",
    "operatingSystem": "All",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    },
    "author": {
      "@type": "Person",
      "name": "Imran Pollob",
      "url": "https://github.com/imranpollob"
    }
  }
  </script>
</head>

<body>
  <div class="app-container">
    <!-- Header / Control Panel -->
    <header class="control-panel" role="banner">
      <div class="header-left">
        <a href="./" class="logo-link" title="CryptoView Home">
          <img src="assets/logo.png" alt="Imran Pollob Logo" class="brand-logo" width="34" height="34" />
          <div class="brand-text">
            <span class="brand-title">CryptoView</span>
          </div>
        </a>
        <span class="live-badge" title="Live market data synced from Coinbase">
          <span class="status-dot"></span> Coinbase Live
        </span>
      </div>

      <div class="header-center">
        <div class="search-container" role="search">
          <div class="input-wrapper">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="coin-search" placeholder="Search crypto pairs (e.g. BTC, ETH, SOL)..."
              autocomplete="off" aria-label="Search cryptocurrency pairs" spellcheck="false" />
            <span class="keyboard-hint" title="Press '/' to search"><kbd>/</kbd></span>
          </div>
          <ul id="search-results" class="search-results" role="listbox" aria-label="Search results"></ul>
        </div>
      </div>

      <div class="header-right">
        <!-- Layout Selector: Charts per row (Visible ONLY on non-mobile screens) -->
        <div class="layout-control" id="layout-control" title="Charts per row (Desktop only)">
          <span class="layout-title">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="2"></rect>
              <line x1="12" y1="3" x2="12" y2="21"></line>
            </svg>
            Grid
          </span>
          <div class="layout-btn-group" role="group" aria-label="Select charts per row">
            <button type="button" class="layout-btn" data-cols="1" aria-label="1 chart per row"
              title="1 chart per row">1</button>
            <button type="button" class="layout-btn active" data-cols="2" aria-label="2 charts per row"
              title="2 charts per row">2</button>
            <button type="button" class="layout-btn" data-cols="3" aria-label="3 charts per row"
              title="3 charts per row">3</button>
            <button type="button" class="layout-btn" data-cols="4" aria-label="4 charts per row"
              title="4 charts per row">4</button>
          </div>
        </div>

        <!-- Theme Toggle -->
        <button type="button" class="icon-btn theme-toggle" id="theme-toggle" title="Switch Theme"
          aria-label="Switch Theme">
          <!-- Sun Icon (visible in dark mode) -->
          <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <!-- Moon Icon (visible in light mode) -->
          <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none;">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>

        <!-- GitHub Repository Link -->
        <a href="https://github.com/imranpollob/crypto-chart-viewer" target="_blank" rel="noopener noreferrer"
          class="icon-btn" title="View Source on GitHub" aria-label="View Source on GitHub">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" clip-rule="evenodd"
              d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" />
          </svg>
        </a>

        <!-- Loading Indicator -->
        <div id="loading-indicator" class="loading hidden" role="status" aria-live="polite">
          <div class="spinner"></div>
          <span>Syncing...</span>
        </div>
      </div>
    </header>

    <!-- Selected Tags Bar -->
    <div id="tags-bar" class="tags-bar">
      <div id="selected-tags" class="tags-container" aria-label="Active crypto charts"></div>
    </div>

    <!-- Charts Grid -->
    <main id="widget-container" class="charts-grid" data-cols="2" role="main">
      <!-- TradingView Widgets will be injected here -->
    </main>

    <!-- Footer for Professional Presence & SEO -->
    <footer class="app-footer" role="contentinfo">
      <div class="footer-content">
        <div class="footer-brand">
          <img src="assets/logo.png" alt="CryptoView Logo" class="footer-logo" width="20" height="20" />
          <span><strong>CryptoView</strong> &bull; Multi-Cryptocurrency Real-Time Chart Terminal</span>
        </div>
        <div class="footer-meta">
          <span>Market data via Coinbase Exchange API &amp; TradingView</span>
          <span class="separator">&bull;</span>
          <span>Crafted by <a href="https://github.com/imranpollob" target="_blank" rel="noopener noreferrer">Imran
              Pollob</a></span>
        </div>
      </div>
    </footer>
  </div>

  <!-- Main ES Module -->
  <script type="module" src="app.js"></script>
</body>

</html>
